name: dvach-bot

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут ставит в очередь следующий запуск
  workflow_dispatch:         # ручной запуск; им же бот сам перезапускает себя в конце

# Запуски идут строго по одному, следующий стартует сразу, как закончится текущий.
# Так бот работает практически непрерывно и без дублей.
concurrency:
  group: dvach-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write             # чистка кэшей и защита расписания от отключения

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Состояние бота (очередь, активные треды) живёт в кэше
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run bot
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          BOARD: b
          RUN_BUDGET: "1500"       # 25 минут работы за один запуск
          # BLOCKWORDS: "слово1,слово2"
        run: python bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cleanup old caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key state- --sort created_at --order desc --limit 100 --json id --jq '.[5:][].id' \
            | xargs -r -n1 gh cache delete

      # GitHub отключает расписание после 60 дней без активности в репозитории;
      # повторное «включение» workflow сбрасывает этот таймер
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable bot.yml --repo ${{ github.repository }}

      # Самоперезапуск: расписание GitHub ненадёжно (может не срабатывать часами),
      # поэтому после успешного запуска бот сам ставит в очередь следующий.
      # Cron выше остаётся запасным вариантом, если цепочка оборвётся.
      - name: Start next run
        if: steps.bot.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
